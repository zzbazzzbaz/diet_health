{% extends 'base.html' %}

{% block title %}选择人群 - 膳食搭配游戏{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col p-8">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center mb-8">
        <a href="{% url 'game:index' %}" class="text-xl text-gray-500 hover:text-gray-700 flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            返回
        </a>
        <div class="text-xl text-gray-600 flex items-center gap-2">
            <i data-lucide="footprints" class="w-5 h-5"></i>
            步骤 1/3
        </div>
    </div>
    
    <!-- 标题 -->
    <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">请选择用餐人群</h1>
        <p class="text-xl text-gray-600">不同人群有不同的营养需求</p>
    </div>
    
    <!-- 人群选择卡片 -->
    <div class="flex-1 flex items-center justify-center">
        <div class="flex gap-8">
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="child">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-blue-400">
                        <i data-lucide="baby" class="w-20 h-20 text-blue-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">小孩</h2>
                        <p class="text-lg text-gray-500">6-12岁儿童</p>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="adult">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-green-400">
                        <i data-lucide="user" class="w-20 h-20 text-green-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">成人</h2>
                        <p class="text-lg text-gray-500">18-60岁成年人</p>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="elder">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-orange-400">
                        <i data-lucide="glasses" class="w-20 h-20 text-orange-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">老人</h2>
                        <p class="text-lg text-gray-500">60岁以上老年人</p>
                    </div>
                </button>
            </form>
        </div>
    </div>
</div>

{% include 'components/timeout_modal.html' %}
{% endblock %}
