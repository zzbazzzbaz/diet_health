{% extends 'base.html' %}

{% block title %}饮食健康知识问答系统{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8">
    <!-- 标题 -->
    <div class="text-center mb-16">
        <h1 class="text-6xl font-bold text-green-600 mb-4">🥗 饮食健康知识问答</h1>
        <p class="text-2xl text-gray-600">学习健康饮食知识，养成良好饮食习惯</p>
    </div>
    
    <!-- 模块入口 -->
    <div class="flex gap-12">
        <!-- 知识问答 -->
        <a href="{% url 'home' %}" class="group">
            <div class="w-80 h-96 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-green-400">
                <div class="text-8xl mb-6">📚</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">知识问答</h2>
                <p class="text-xl text-gray-500 text-center">测试你的饮食健康知识</p>
                <div class="mt-6 px-8 py-3 bg-green-500 text-white text-xl rounded-full group-hover:bg-green-600 transition-colors">
                    开始答题
                </div>
            </div>
        </a>
        
        <!-- 膳食搭配 -->
        <a href="{% url 'home' %}" class="group">
            <div class="w-80 h-96 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-orange-400">
                <div class="text-8xl mb-6">🍽️</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">膳食搭配</h2>
                <p class="text-xl text-gray-500 text-center">学习科学搭配一日三餐</p>
                <div class="mt-6 px-8 py-3 bg-orange-500 text-white text-xl rounded-full group-hover:bg-orange-600 transition-colors">
                    开始游戏
                </div>
            </div>
        </a>
    </div>
    
    <!-- 底部提示 -->
    <div class="mt-16 text-gray-400 text-lg">
        点击卡片开始体验
    </div>
</div>
{% endblock %}
