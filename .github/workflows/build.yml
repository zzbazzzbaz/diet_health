name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.10']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Install dependencies
      run: |
        uv sync
        uv pip install pyinstaller
    
    - name: Create logs directory
      run: |
        mkdir -p logs
    
    - name: Collect static files
      run: |
        uv run python manage.py collectstatic --noinput
    
    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        uv run pyinstaller build_exe.spec
    
    - name: Build with PyInstaller (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        uv run pyinstaller build_exe.spec
    
    - name: Get OS name
      id: os-name
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "name=windows" >> $GITHUB_OUTPUT
          echo "ext=.exe" >> $GITHUB_OUTPUT
        elif [ "${{ runner.os }}" == "macOS" ]; then
          echo "name=macos" >> $GITHUB_OUTPUT
          echo "ext=" >> $GITHUB_OUTPUT
        else
          echo "name=linux" >> $GITHUB_OUTPUT
          echo "ext=" >> $GITHUB_OUTPUT
        fi
    
    - name: Rename dist folder
      shell: bash
      run: |
        cd dist
        if [ -d "膳食健康知识问答系统" ]; then
          mv "膳食健康知识问答系统" "diet-health-${{ steps.os-name.outputs.name }}"
        fi
    
    - name: Create archive (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        Compress-Archive -Path "diet-health-${{ steps.os-name.outputs.name }}" -DestinationPath "diet-health-${{ steps.os-name.outputs.name }}.zip"
    
    - name: Create archive (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf "diet-health-${{ steps.os-name.outputs.name }}.tar.gz" "diet-health-${{ steps.os-name.outputs.name }}"
    
    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: diet-health-${{ steps.os-name.outputs.name }}
        path: dist/diet-health-${{ steps.os-name.outputs.name }}.zip
        retention-days: 30
    
    - name: Upload artifact (macOS/Linux)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: diet-health-${{ steps.os-name.outputs.name }}
        path: dist/diet-health-${{ steps.os-name.outputs.name }}.tar.gz
        retention-days: 30
    
    - name: Upload to Release (Windows)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/diet-health-${{ steps.os-name.outputs.name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to Release (macOS/Linux)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/diet-health-${{ steps.os-name.outputs.name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
