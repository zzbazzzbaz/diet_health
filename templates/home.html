{% extends 'base.html' %}
{% load static %}

{% block title %}饮食健康知识问答系统{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8 page-enter">
    <!-- Logo和标题 -->
    <div class="text-center mb-16">
        <div class="flex items-center justify-center gap-4 mb-6">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="w-24 h-24 object-contain">
        </div>
        <h1 class="text-6xl font-bold text-gradient-green mb-4">饮食健康知识问答</h1>
        <p class="text-2xl text-gray-500">学习健康饮食知识，养成良好饮食习惯</p>
    </div>
    
    <!-- 模块入口 -->
    <div class="flex gap-12">
        <!-- 知识问答 -->
        <a href="{% url 'quiz:index' %}" class="group">
            <div class="w-80 h-96 card card-hover p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-green-400">
                <div class="w-28 h-28 rounded-full bg-green-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <i data-lucide="book-open" class="w-14 h-14 text-green-500"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-3">知识问答</h2>
                <p class="text-xl text-gray-500 text-center mb-6">测试你的饮食健康知识</p>
                <div class="btn btn-primary btn-lg">
                    开始答题
                </div>
            </div>
        </a>
        
        <!-- 膳食搭配 -->
        <a href="{% url 'game:index' %}" class="group">
            <div class="w-80 h-96 card card-hover p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-orange-400">
                <div class="w-28 h-28 rounded-full bg-orange-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <i data-lucide="utensils" class="w-14 h-14 text-orange-500"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-3">膳食搭配</h2>
                <p class="text-xl text-gray-500 text-center mb-6">学习科学搭配一日三餐</p>
                <div class="btn btn-secondary btn-lg">
                    开始游戏
                </div>
            </div>
        </a>
    </div>
    
    <!-- 底部提示 -->
    <div class="mt-16 flex items-center gap-2 text-gray-400 text-lg">
        <i data-lucide="hand" class="w-5 h-5"></i>
        <span>点击卡片开始体验</span>
    </div>
    
    <!-- 所属单位 -->
    <div class="mt-8 text-center">
        <div class="flex items-center justify-center gap-6 text-gray-500">
            <div class="flex items-center gap-2">
                <i data-lucide="school" class="w-5 h-5"></i>
                <span>江西师范大学附属东临新区实验学校</span>
            </div>
            <span class="text-gray-300">|</span>
            <div class="flex items-center gap-2">
                <i data-lucide="building-2" class="w-5 h-5"></i>
                <span>抚州市市场监督管理局</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
