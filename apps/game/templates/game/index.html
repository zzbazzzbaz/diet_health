{% extends 'base.html' %}

{% block title %}膳食搭配游戏 - 饮食健康知识问答系统{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8 page-enter">
    <div class="text-center">
        <!-- 图标 -->
        <div class="w-40 h-40 mx-auto rounded-full bg-orange-100 flex items-center justify-center mb-8 pop-in">
            <i data-lucide="utensils" class="w-20 h-20 text-orange-500"></i>
        </div>
        
        <!-- 标题 -->
        <h1 class="text-5xl font-bold text-gradient-orange mb-4">膳食搭配游戏</h1>
        <p class="text-2xl text-gray-500 mb-6">学习如何科学搭配一日三餐</p>
        
        <!-- 游戏说明 -->
        <div class="max-w-lg mx-auto mb-10 p-6 bg-white rounded-2xl shadow-lg">
            <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center justify-center gap-2">
                <i data-lucide="info" class="w-5 h-5 text-blue-500"></i>
                游戏说明
            </h3>
            <div class="text-left space-y-3 text-gray-600">
                <div class="flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold flex-shrink-0">1</span>
                    <span>选择用餐人群（小孩/成人/老人）</span>
                </div>
                <div class="flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold flex-shrink-0">2</span>
                    <span>选择用餐时段（早餐/午餐/晚餐）</span>
                </div>
                <div class="flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold flex-shrink-0">3</span>
                    <span>拖拽食物到餐盘，搭配一顿健康餐</span>
                </div>
                <div class="flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold flex-shrink-0">4</span>
                    <span>AI营养师为你的搭配打分并给出建议</span>
                </div>
            </div>
        </div>
        
        <!-- 开始按钮 -->
        <a href="{% url 'game:crowd' %}" class="btn btn-secondary btn-xl pulse">
            <i data-lucide="play" class="w-8 h-8"></i>
            开始游戏
        </a>
        
        <!-- 返回链接 -->
        <div class="mt-12">
            <a href="{% url 'home' %}" class="text-xl text-gray-400 hover:text-gray-600 inline-flex items-center gap-2 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
