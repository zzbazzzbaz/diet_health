{% extends 'base.html' %}

{% block title %}知识问答 - 饮食健康知识问答系统{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8">
    <div class="text-center">
        <i data-lucide="book-open" class="w-32 h-32 text-green-500 mx-auto mb-8"></i>
        <h1 class="text-5xl font-bold text-green-600 mb-6">饮食健康知识问答</h1>
        <p class="text-2xl text-gray-600 mb-12">测试你对健康饮食的了解程度</p>
        
        {% if error %}
        <div class="mb-8 p-4 bg-red-100 text-red-700 rounded-xl text-xl flex items-center justify-center gap-2">
            <i data-lucide="alert-circle" class="w-6 h-6"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <a href="{% url 'quiz:start' %}" class="inline-flex items-center gap-3 px-12 py-5 bg-green-500 text-white text-3xl font-bold rounded-full hover:bg-green-600 transition-all duration-300 hover:scale-105 shadow-lg">
            <i data-lucide="play" class="w-8 h-8"></i>
            开始答题
        </a>
        
        <div class="mt-12">
            <a href="{% url 'home' %}" class="text-xl text-gray-500 hover:text-gray-700 inline-flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
