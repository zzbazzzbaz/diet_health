{% extends 'base.html' %}

{% block title %}答题结果 - 知识问答{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8">
    <div class="bg-white rounded-3xl shadow-xl p-12 text-center max-w-2xl">
        <!-- 分数展示 -->
        <div class="mb-8">
            <div class="mb-4">
                {% if score >= 80 %}
                <i data-lucide="trophy" class="w-24 h-24 text-yellow-500 mx-auto"></i>
                {% elif score >= 60 %}
                <i data-lucide="thumbs-up" class="w-24 h-24 text-green-500 mx-auto"></i>
                {% else %}
                <i data-lucide="target" class="w-24 h-24 text-orange-500 mx-auto"></i>
                {% endif %}
            </div>
            <div class="text-7xl font-bold text-green-600 score-animate">
                {{ score }}<span class="text-4xl">分</span>
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="mb-8 text-2xl text-gray-600">
            共 <span class="font-bold text-gray-800">{{ total }}</span> 题，
            答对 <span class="font-bold text-green-600">{{ correct_count }}</span> 题
        </div>
        
        <!-- 评价 -->
        <div class="mb-10 p-6 bg-gradient-to-r from-green-50 to-orange-50 rounded-2xl">
            <p class="text-2xl text-gray-700">{{ comment }}</p>
        </div>
        
        <!-- 操作按钮 -->
        <div class="flex gap-6 justify-center">
            <a href="{% url 'quiz:start' %}" class="inline-flex items-center gap-2 px-10 py-4 bg-green-500 text-white text-xl font-bold rounded-full hover:bg-green-600 transition-all">
                <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                再来一次
            </a>
            <a href="{% url 'home' %}" class="inline-flex items-center gap-2 px-10 py-4 bg-gray-200 text-gray-700 text-xl font-bold rounded-full hover:bg-gray-300 transition-all">
                <i data-lucide="home" class="w-6 h-6"></i>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
