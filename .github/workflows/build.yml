name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Install dependencies
      shell: bash
      run: |
        uv sync
        uv pip install pyinstaller
    
    - name: Create logs directory
      shell: bash
      run: |
        mkdir -p logs
    
    - name: Collect static files
      shell: bash
      run: |
        uv run python manage.py collectstatic --noinput
    
    - name: Build with PyInstaller
      shell: bash
      run: |
        uv run pyinstaller build_exe.spec
    
    - name: Rename dist folder
      shell: bash
      run: |
        cd dist
        if [ -d "膳食健康知识问答系统" ]; then
          mv "膳食健康知识问答系统" "diet-health-windows"
        fi
    
    - name: Create archive
      shell: bash
      run: |
        cd dist
        7z a -tzip "diet-health-windows.zip" "diet-health-windows"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: diet-health-windows
        path: dist/diet-health-windows.zip
        retention-days: 30
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/diet-health-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
