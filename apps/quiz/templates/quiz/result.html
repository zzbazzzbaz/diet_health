{% extends 'base.html' %}

{% block title %}答题结果 - 知识问答{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8 page-enter">
    <div class="result-card p-12 text-center max-w-2xl w-full">
        <!-- 分数展示 -->
        <div class="mb-8">
            <div class="mb-6">
                {% if score >= 80 %}
                <div class="w-32 h-32 mx-auto rounded-full bg-yellow-100 flex items-center justify-center pop-in">
                    <i data-lucide="trophy" class="w-16 h-16 text-yellow-500"></i>
                </div>
                {% elif score >= 60 %}
                <div class="w-32 h-32 mx-auto rounded-full bg-green-100 flex items-center justify-center pop-in">
                    <i data-lucide="thumbs-up" class="w-16 h-16 text-green-500"></i>
                </div>
                {% else %}
                <div class="w-32 h-32 mx-auto rounded-full bg-orange-100 flex items-center justify-center pop-in">
                    <i data-lucide="target" class="w-16 h-16 text-orange-500"></i>
                </div>
                {% endif %}
            </div>
            
            <!-- 圆形进度分数 -->
            <div class="score-circle mb-4">
                <svg class="w-48 h-48 mx-auto" viewBox="0 0 100 100">
                    <circle class="circle-progress-bg" cx="50" cy="50" r="42" stroke-width="8"/>
                    <circle class="circle-progress circle-progress-fill" cx="50" cy="50" r="42" stroke-width="8"
                            stroke="{% if score >= 80 %}#22c55e{% elif score >= 60 %}#f97316{% else %}#ef4444{% endif %}"
                            stroke-dasharray="{% widthratio score 100 264 %} 264"/>
                </svg>
                <div class="score-value">
                    <div class="score-animate">
                        <span class="text-6xl font-bold {% if score >= 80 %}text-green-600{% elif score >= 60 %}text-orange-500{% else %}text-red-500{% endif %}">{{ score }}</span>
                        <span class="text-2xl text-gray-500">分</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="mb-8 flex justify-center gap-8">
            <div class="text-center">
                <div class="text-4xl font-bold text-gray-800">{{ total }}</div>
                <div class="text-lg text-gray-500">总题数</div>
            </div>
            <div class="w-px bg-gray-200"></div>
            <div class="text-center">
                <div class="text-4xl font-bold text-green-600">{{ correct_count }}</div>
                <div class="text-lg text-gray-500">答对</div>
            </div>
            <div class="w-px bg-gray-200"></div>
            <div class="text-center">
                <div class="text-4xl font-bold text-red-500">{{ wrong_count }}</div>
                <div class="text-lg text-gray-500">答错</div>
            </div>
        </div>
        
        <!-- 评价 -->
        <div class="mb-10 p-6 bg-gradient-to-r from-green-50 to-blue-50 rounded-2xl">
            <div class="flex items-center justify-center gap-2 mb-2">
                <i data-lucide="message-circle" class="w-5 h-5 text-green-500"></i>
                <span class="text-lg font-medium text-gray-600">评价</span>
            </div>
            <p class="text-2xl text-gray-700">{{ comment }}</p>
        </div>
        
        <!-- 操作按钮 -->
        <div class="flex gap-6 justify-center">
            <a href="{% url 'quiz:start' %}" class="btn btn-primary btn-lg">
                <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                再来一次
            </a>
            <a href="{% url 'home' %}" class="btn btn-ghost btn-lg border-2 border-gray-200">
                <i data-lucide="home" class="w-6 h-6"></i>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
