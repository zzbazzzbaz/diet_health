{% extends 'base.html' %}

{% block title %}选择用餐时段 - 膳食搭配游戏{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col p-8">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center mb-8">
        <a href="{% url 'game:crowd' %}" class="text-xl text-gray-500 hover:text-gray-700 flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            返回
        </a>
        <div class="text-xl text-gray-600 flex items-center gap-2">
            <i data-lucide="footprints" class="w-5 h-5"></i>
            步骤 2/3
        </div>
    </div>
    
    <!-- 标题 -->
    <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">请选择用餐时段</h1>
        <p class="text-xl text-gray-600">一日三餐各有不同的搭配要点</p>
    </div>
    
    <!-- 时段选择卡片 -->
    <div class="flex-1 flex items-center justify-center">
        <div class="flex gap-8">
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="meal" value="breakfast">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-yellow-400">
                        <i data-lucide="sunrise" class="w-20 h-20 text-yellow-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">早餐</h2>
                        <p class="text-lg text-gray-500">一日之计在于晨</p>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="meal" value="lunch">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-orange-400">
                        <i data-lucide="sun" class="w-20 h-20 text-orange-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">午餐</h2>
                        <p class="text-lg text-gray-500">补充能量好时机</p>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="meal" value="dinner">
                <button type="submit" class="group">
                    <div class="w-72 h-80 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center transition-all duration-300 hover:scale-105 hover:shadow-2xl border-4 border-transparent hover:border-purple-400">
                        <i data-lucide="moon" class="w-20 h-20 text-purple-500 mb-6"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">晚餐</h2>
                        <p class="text-lg text-gray-500">清淡为宜助消化</p>
                    </div>
                </button>
            </form>
        </div>
    </div>
</div>

{% include 'components/timeout_modal.html' %}
{% endblock %}
