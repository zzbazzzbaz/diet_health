<!-- 超时提示弹窗 -->
<div id="timeout-modal" class="hidden modal-overlay">
    <div class="modal-content max-w-md mx-4 text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-orange-100 flex items-center justify-center mb-4 pop-in">
            <i data-lucide="clock" class="w-10 h-10 text-orange-500"></i>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-4">您还在吗？</h3>
        <p class="text-gray-600 mb-2">检测到您已有一段时间没有操作</p>
        <p class="mb-6">
            <span id="countdown" class="text-4xl font-bold text-orange-500">10</span>
            <span class="text-gray-500">秒后将返回首页</span>
        </p>
        <button onclick="resetIdleTimer()" class="btn btn-primary btn-lg">
            <i data-lucide="hand" class="w-5 h-5"></i>
            继续操作
        </button>
    </div>
</div>
