{% extends 'base.html' %}
{% load static %}

{% block title %}饮食健康知识问答系统{% endblock %}

{% block extra_css %}
<style>
    html, body {
        overflow: hidden;
        height: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div class="h-screen w-screen overflow-hidden flex items-center justify-center bg-gradient-to-br from-green-50 to-orange-50">
    <div class="w-full max-w-[1800px] h-full flex flex-col justify-center px-12 py-8">
        <!-- 顶部：Logo和标题 - 横向布局 -->
        <div class="flex items-center justify-center gap-8 mb-8">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="w-48 h-48 object-contain">
            <div class="text-center">
                <h1 class="text-5xl font-bold text-gradient-green mb-2">饮食健康知识问答</h1>
                <p class="text-xl text-gray-500">学习健康饮食知识，养成良好饮食习惯</p>
            </div>
            <img src="{% static 'images/logo2.png' %}" alt="Logo2" class="w-48 h-48 object-contain">
        </div>
        
        <!-- 中间：模块入口 - 横向布局 -->
        <div class="flex justify-center gap-16 mb-6">
            <!-- 知识问答 -->
            <a href="{% url 'quiz:index' %}" class="group">
                <div class="w-96 h-96 card card-hover p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-green-400">
                    <div class="w-28 h-28 rounded-full bg-green-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <i data-lucide="book-open" class="w-14 h-14 text-green-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-3">知识问答</h2>
                    <p class="text-lg text-gray-500 text-center mb-6">测试你的饮食健康知识</p>
                    <div class="btn btn-primary btn-lg">
                        开始答题
                    </div>
                </div>
            </a>
            
            <!-- 膳食搭配 -->
            <a href="{% url 'game:index' %}" class="group">
                <div class="w-96 h-96 card card-hover p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-orange-400">
                    <div class="w-28 h-28 rounded-full bg-orange-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <i data-lucide="utensils" class="w-14 h-14 text-orange-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-3">膳食搭配</h2>
                    <p class="text-lg text-gray-500 text-center mb-6">学习科学搭配一日三餐</p>
                    <div class="btn btn-secondary btn-lg">
                        开始游戏
                    </div>
                </div>
            </a>
        </div>
        
        <!-- 底部：提示和单位信息 - 横向布局 -->
        <div class="flex flex-col items-center gap-4">
            <div class="flex items-center gap-2 text-gray-400 text-base">
                <i data-lucide="hand" class="w-5 h-5"></i>
                <span>点击卡片开始体验</span>
            </div>
            
            <div class="flex items-center justify-center gap-6 text-gray-500 text-sm">
                <div class="flex items-center gap-2">
                    <i data-lucide="school" class="w-4 h-4"></i>
                    <span>江西师范大学附属东临新区实验学校</span>
                </div>
                <span class="text-gray-300">|</span>
                <div class="flex items-center gap-2">
                    <i data-lucide="building-2" class="w-4 h-4"></i>
                    <span>抚州市市场监督管理局</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
