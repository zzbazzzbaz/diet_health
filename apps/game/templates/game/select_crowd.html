{% extends 'base.html' %}

{% block title %}选择人群 - 膳食搭配游戏{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col p-8 page-enter">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center mb-8">
        <a href="{% url 'game:index' %}" class="text-xl text-gray-400 hover:text-gray-600 flex items-center gap-2 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            返回
        </a>
        <div class="flex items-center gap-3">
            <div class="flex gap-2">
                <div class="w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold">1</div>
                <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center font-bold">2</div>
                <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center font-bold">3</div>
            </div>
        </div>
    </div>
    
    <!-- 标题 -->
    <div class="text-center mb-12">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-orange-100 text-orange-600 rounded-full text-lg font-medium mb-4">
            <i data-lucide="users" class="w-5 h-5"></i>
            步骤 1/3
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-4">请选择用餐人群</h1>
        <p class="text-xl text-gray-500">不同人群有不同的营养需求</p>
    </div>
    
    <!-- 人群选择卡片 -->
    <div class="flex-1 flex items-center justify-center">
        <div class="flex gap-8">
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="child">
                <button type="submit" class="group">
                    <div class="card card-hover w-72 h-80 p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-blue-400">
                        <div class="w-24 h-24 rounded-full bg-blue-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                            <i data-lucide="baby" class="w-12 h-12 text-blue-500"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">小孩</h2>
                        <p class="text-lg text-gray-500">6-12岁儿童</p>
                        <div class="mt-4 tag tag-blue">
                            <i data-lucide="sparkles" class="w-4 h-4 mr-1"></i>
                            成长发育期
                        </div>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="adult">
                <button type="submit" class="group">
                    <div class="card card-hover w-72 h-80 p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-green-400">
                        <div class="w-24 h-24 rounded-full bg-green-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                            <i data-lucide="user" class="w-12 h-12 text-green-500"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">成人</h2>
                        <p class="text-lg text-gray-500">18-60岁成年人</p>
                        <div class="mt-4 tag tag-green">
                            <i data-lucide="zap" class="w-4 h-4 mr-1"></i>
                            精力充沛期
                        </div>
                    </div>
                </button>
            </form>
            
            <form method="post" class="inline">
                {% csrf_token %}
                <input type="hidden" name="crowd" value="elder">
                <button type="submit" class="group">
                    <div class="card card-hover w-72 h-80 p-8 flex flex-col items-center justify-center border-4 border-transparent group-hover:border-orange-400">
                        <div class="w-24 h-24 rounded-full bg-orange-100 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                            <i data-lucide="glasses" class="w-12 h-12 text-orange-500"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">老人</h2>
                        <p class="text-lg text-gray-500">60岁以上老年人</p>
                        <div class="mt-4 tag tag-orange">
                            <i data-lucide="heart" class="w-4 h-4 mr-1"></i>
                            养生保健期
                        </div>
                    </div>
                </button>
            </form>
        </div>
    </div>
</div>

{% include 'components/timeout_modal.html' %}
{% endblock %}
