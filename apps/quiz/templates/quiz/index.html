{% extends 'base.html' %}

{% block title %}知识问答 - 饮食健康知识问答系统{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-8 page-enter">
    <div class="text-center">
        <div class="w-36 h-36 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-8 pulse">
            <i data-lucide="book-open" class="w-20 h-20 text-green-500"></i>
        </div>
        <h1 class="text-5xl font-bold text-gradient-green mb-6">饮食健康知识问答</h1>
        <p class="text-2xl text-gray-500 mb-12">测试你对健康饮食的了解程度</p>
        
        {% if error %}
        <div class="mb-8 p-4 bg-red-50 border border-red-200 text-red-700 rounded-2xl text-xl flex items-center justify-center gap-2 pop-in">
            <i data-lucide="alert-circle" class="w-6 h-6"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <a href="{% url 'quiz:start' %}" class="btn btn-primary btn-xl">
            <i data-lucide="play" class="w-7 h-7"></i>
            开始答题
        </a>
        
        <div class="mt-12">
            <a href="{% url 'home' %}" class="text-xl text-gray-400 hover:text-gray-600 inline-flex items-center gap-2 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
